<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
</head>
<body>
<script>
	function setup(){
		createCanvas(800,800)
	}
	function draw(){
		background(200)
		//push()
		//rectMode(CENTER)
		//translate(width/2, height/2)
		//rotate(frameCount*0.01)
		//rect(0, 0, 100, 70)
		//pop()

		//push()
		//rectMode(CENTER)
		//translate(100,100)
		//rotate(frameCount *0,01)
		//rect(0, 0, 80, 20)
		//pop()
		push()
		translate(width/2, height/2)
		rotate(frameCount*0.01)
		circle(0,0,60)
		fill('black')
		circle(-100, -100, 80)
		circle(100, -100, 80)
		fill('white')
		circle(0, 0, 200)
		pop()

		push()
		rectMode(CENTER)
		translate(100,100)
		rotate(frameCount*0.01)
		fill('black')
		circle(25, -25, 20)
		circle(-25, -25, 20)
		fill('white')
		circle(0, 0, 50)
		pop()

		push()
		fill('pink')
		rectMode(CENTER)
		translate(700,700)
		rotate(frameCount*0.01)
		circle(25, -25, 50)
		circle(25, 20, 50)
		circle(-23, 20, 50)
		circle(-23, -25, 50)
		fill('yellow')
		circle(0, 0, 50)
		pop()
	}
</script>
</body>
</html>
